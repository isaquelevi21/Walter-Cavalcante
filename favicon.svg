<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo Verde da Campanha -->
  <rect width="512" height="512" rx="110" fill="#196B32"/>
  
  <!-- Efeito sutil de iluminação -->
  <rect width="512" height="512" rx="110" fill="url(#grad)" opacity="0.15"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- Letras W (Branco) e C (Laranja) -->
  <text x="256" y="300" font-family="'Arial Black', 'Segoe UI Black', Impact, sans-serif" font-size="280" font-weight="900" text-anchor="middle" dominant-baseline="middle" letter-spacing="-10">
    <tspan fill="#FFFFFF">W</tspan><tspan fill="#EF7C00">C</tspan>
  </text>
</svg>
